editor_maps: ذخیرهٔ خودکار نقشه‌های نام‌گذاری‌شدهٔ ویرایشگر
editor_maps_tooltip: نقشه را یک بار ذخیره کنید تا نام بگیرد. یک نسخهٔ بازیابی کنار آن می‌ماند تا زمانی که نقشهٔ اصلی را دوباره ذخیره کنید.
