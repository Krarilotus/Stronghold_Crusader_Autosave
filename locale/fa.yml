delete_after_days_tooltip: فایل‌های کنار گذاشته‌شده پس از این تعداد روز حذف می‌شوند. عدد 0 آن‌ها را تا زمان بازیابی یا حذف دستی نگه می‌دارد.
delete_group: ذخیره‌ها و نقشه‌های حذف‌شده
enabled: روشن بودن ذخیرهٔ خودکار در نصب نخست
qol: سهولت استفاده
versions: تعداد ذخیره‌های خودکار بازی برای نگهداری
