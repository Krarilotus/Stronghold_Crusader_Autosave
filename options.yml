meta:
  version: 1.0.0
options:
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{autosave_group}}'
  hasHeader: true
  children:
  - url: autosave.versions
    name: autosave-versions
    text: '{{versions}}'
    display: Slider
    contents:
      value: 5
      min: 1
      max: 5
      step: 1
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{delete_group}}'
  hasHeader: true
  children:
  - url: autosave.delete_after_days
    name: autosave-delete-after-days
    text: '{{delete_after_days}}'
    tooltip: '{{delete_after_days_tooltip}}'
    display: Slider
    contents:
      value: 7
      min: 0
      max: 3650
      step: 1
