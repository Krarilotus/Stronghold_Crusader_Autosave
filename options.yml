meta:
  version: 1.0.0
options:
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{autosave_group}}'
  hasHeader: true
  children:
  - url: autosave.enabled
    name: autosave-enabled
    text: '{{enabled}}'
    tooltip: '{{versions_help}}'
    display: Switch
    contents:
      value: false
  - url: autosave.versions
    name: autosave-versions
    text: '{{versions}}'
    display: Slider
    contents:
      value: 5
      min: 1
      max: 5
      step: 1
  - url: autosave.editor_maps
    name: autosave-editor-maps
    text: '{{editor_maps}}'
    tooltip: '{{editor_maps_tooltip}}'
    display: Switch
    contents:
      value: false
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{delete_group}}'
  text: '{{delete_after_days_tooltip}}'
  hasHeader: true
  children:
  - url: autosave.dialog_controls
    name: autosave-dialog-controls
    text: '{{dialog_controls}}'
    display: Switch
    contents:
      value: false
  - url: autosave.delete_after_days
    name: autosave-delete-after-days
    text: '{{delete_after_days}}'
    display: Slider
    contents:
      value: 0
      min: 0
      max: 3650
      step: 1
